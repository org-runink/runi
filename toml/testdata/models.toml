# Sampling configuration for the models an agent harness can route to.
# One [[models]] entry per model; [models.sampling] holds the request
# defaults, [models.limits] what the server will accept.

version = 3
updated = 2026-10-29T08:15:00Z

[defaults]
temperature = 0.7
top_p = 0.95
max_tokens = 1_024
stream = true
stop = ["</s>", "<|im_end|>"]
retry = { attempts = 3, backoff_ms = 250, jitter = 0.2 }

[[models]]
name = "chat-small"
id = 'local/chat-small-q4'
tags = ["chat", "summarise"]
enabled = true
system = """
You are a careful assistant. Answer in plain language, \
and say so when you do not know."""

[models.sampling]
temperature = 0.7
top_p = 0.9
top_k = 40
min_p = 0.05
repetition_penalty = 1.05
presence_penalty = 0.0
frequency_penalty = 0.0
max_tokens = 2048
seed = 0x5EED
stop = [
  "</s>",
  "<|im_end|>",   # chat-template terminator
]

[models.limits]
context = 8192
max_batch = 8
timeout_s = 1.5e2

