name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, so a green badge means "passes on current toolchains", not
    # "passed once when it was merged".
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Supported Go versions and all three first-class platforms. A package
        # with no dependencies should build everywhere; this proves it rather
        # than assuming it.
        go: ['1.24', '1.25']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: test -race
        run: go test -race -count=1 ./...

  quality:
    name: format, coverage, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt must be clean
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: ZERO dependencies is a guarantee, not an aspiration
        run: |
          # The defining property of this module. If a require line ever appears,
          # this fails the build rather than letting it land quietly.
          if grep -qE '^\s*require' go.mod; then
            echo "::error::go.mod gained a dependency; runi is standard-library only"; exit 1
          fi
          deps=$(go list -deps ./... | grep -c '^github\.com/\|^golang\.org/x/' || true)
          if [ "$deps" -ne 0 ]; then
            echo "::error::non-stdlib packages in the dependency graph"; go list -deps ./...; exit 1
          fi
          echo "confirmed: standard library only"

  benchmarks:
    name: benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: run every benchmark once
        # Not a performance gate — shared runners are too noisy for that. This
        # proves the benchmarks still COMPILE AND RUN, so the numbers in the
        # README stay reproducible.
        run: go test -run '^$' -bench . -benchtime 1x ./...
