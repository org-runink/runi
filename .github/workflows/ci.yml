name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, so a green badge means "passes on current toolchains", not
    # "passed once when it was merged".
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Supported Go versions and all three first-class platforms. A package
        # with no dependencies should build everywhere; this proves it rather
        # than assuming it.
        go: ['1.24', '1.25']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: test -race
        run: go test -race -count=1 ./...

  quality:
    name: format, coverage, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25'
      - name: gofmt must be clean
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: coverage must not regress
        run: |
          go test -coverprofile=coverage.out ./arimax ./memo ./lazy
          go tool cover -func=coverage.out | tail -1
          # A floor, not a target. It exists so a change that drops a tested
          # branch fails here rather than being noticed months later. Raise it
          # when coverage genuinely rises; never lower it to make a build pass.
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9.]+%' | tr -d '%')
          floor=99.0
          echo "total coverage ${total}% (floor ${floor}%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 < f+0) { exit 1 } }' || {
            echo "::error::coverage ${total}% is below the ${floor}% floor"; exit 1; }
      - name: ZERO dependencies is a guarantee, not an aspiration
        run: |
          set -u
          MODULE=$(go list -m)
          fail=0

          # 1. go.mod must declare no requirements.
          if grep -qE '^[[:space:]]*require' go.mod; then
            echo "::error::go.mod gained a dependency; runi is standard-library only"; fail=1
          fi

          # 2. The module graph must contain only this module. (`go mod graph` is
          #    NOT usable here: it always lists the go/toolchain pseudo-modules.)
          mods=$(go list -m all | grep -v "^${MODULE}$" || true)
          if [ -n "$mods" ]; then
            echo "::error::module graph is not empty:"; echo "$mods"; fail=1
          fi

          # 3. No imported package may live outside the standard library. A
          #    non-stdlib import path has a dot in its first segment (a domain);
          #    runi's own packages share the module prefix and are not deps.
          ext() { grep -E '^[^/]*\.' | grep -v "^${MODULE}\(/\|$\)" || true; }
          external=$(go list -deps ./... | ext)
          if [ -n "$external" ]; then
            echo "::error::non-stdlib packages in the dependency graph:"; echo "$external"; fail=1
          fi

          # 4. Prove the filter above can still fail. A guard that cannot fail is
          #    worse than no guard: the first version of this step matched runi's
          #    OWN packages and so could never pass. Feed it a known dependency
          #    and require that it is flagged.
          canary=$(printf 'fmt\n%s/memo\ngithub.com/pkg/errors\n' "$MODULE" | ext)
          if [ "$canary" != "github.com/pkg/errors" ]; then
            echo "::error::the dependency filter is broken - it did not flag an injected dependency"
            echo "expected 'github.com/pkg/errors', got '$canary'"; fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "confirmed: standard library only (filter self-test passed)"

  benchmarks:
    name: benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25'
      - name: run every benchmark once
        # Not a performance gate — shared runners are too noisy for that. This
        # proves the benchmarks still COMPILE AND RUN, so the numbers in the
        # README stay reproducible.
        run: go test -run '^$' -bench . -benchtime 1x ./...
