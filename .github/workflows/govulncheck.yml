name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: a vulnerability can be published against a dependency-free module
    # too, because the standard library is a dependency.
    - cron: '41 5 * * *'

permissions:
  contents: read

jobs:
  govulncheck:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
