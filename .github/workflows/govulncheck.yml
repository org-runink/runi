name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: a vulnerability can be published against a dependency-free module
    # too, because the standard library is a dependency.
    - cron: '41 5 * * *'

permissions:
  contents: read

jobs:
  govulncheck:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
